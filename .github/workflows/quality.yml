name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm run check

      - name: Validate Expo dependencies
        run: pnpm dlx expo-doctor@1.20.3

      - name: Export Android bundle
        run: pnpm exec expo export --platform android --output-dir .expo-export-ci

      - name: Enforce Android export budget
        run: pnpm run check:export-budget .expo-export-ci
